name: Build Windows Setup Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Read App Version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check whether this version is already released
        id: release_tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          $exists = -not [string]::IsNullOrWhiteSpace(($existingTag -join ""))
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build Windows Setup (.exe) & Portable
        run: npm run dist -- --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatTarayici-Windows-Executables
          path: dist/*.exe

      - name: Publish GitHub Release with Setup.exe
        uses: softprops/action-gh-release@v2
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && steps.release_tag.outputs.exists != 'true'
        with:
          name: ChatTarayıcı v${{ steps.app_version.outputs.version }}
          tag_name: v${{ steps.app_version.outputs.version }}
          files: dist/*.exe
          body: |
            ## 🚀 ChatTarayıcı Kurulum Dosyaları

            Güncelleme uygulama açılışında otomatik denetlenir. Windows Setup dosyası uygulamayı günceller.

            - **ChatTarayici Setup**: Standart Windows kurulum dosyası
            - **ChatTarayici**: Taşınabilir sürüm
