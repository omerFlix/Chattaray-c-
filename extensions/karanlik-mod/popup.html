<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e8e8f0;
      margin: 0;
      padding: 16px;
      width: 220px;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #a855f7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #9ca3af;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>🌙 Karanlık Mod</h3>
  <p>Bu eklenti açık olduğunda tüm siteler otomatik koyu renkli olur.</p>
  <div style="text-align: center;">
    <span class="badge">Aktif</span>
  </div>
</body>
</html>
