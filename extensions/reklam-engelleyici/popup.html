<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      width: 320px;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(108, 99, 255, 0.2);
    }
    .shield-icon {
      font-size: 26px;
      color: #34d399;
      filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.4));
      transition: all 0.3s;
    }
    .shield-icon.off {
      color: #f87171;
      filter: drop-shadow(0 0 8px rgba(248, 113, 113, 0.4));
    }
    .title h3 {
      font-size: 15px;
      font-weight: 700;
      color: #e8e8f0;
    }
    .title p {
      font-size: 11px;
      color: #9ca3af;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid rgba(108, 99, 255, 0.2);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-info h4 {
      font-size: 13px;
      font-weight: 600;
    }
    .toggle-info span {
      font-size: 11px;
      color: #9ca3af;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #2d2d5e; transition: .3s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background: linear-gradient(135deg, #10b981, #059669); }
    input:checked + .slider:before { transform: translateX(20px); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: #16213e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(108, 99, 255, 0.15);
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: #34d399;
    }
    .stat-label {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 2px;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <div id="shield" class="shield-icon">🛡️</div>
    <div class="title">
      <h3>Kalkan Reklam Engelleyici</h3>
      <p id="status-label">Korumalı ve Güvenli</p>
    </div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <div class="toggle-info">
        <h4>Reklam Engelleme</h4>
        <span id="state-text">Şu an Aktif</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="adblockToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-num" id="blockedCount">142</div>
      <div class="stat-label">Engellenen Reklam</div>
    </div>
    <div class="stat-box">
      <div class="stat-num">Aktif ✅</div>
      <div class="stat-label">YouTube Atlayıcı</div>
    </div>
  </div>

  <div class="footer-note">
    İstediğiniz zaman tek tıkla kapatıp açabilirsiniz.
  </div>

  <script src="popup.js"></script>
</body>
</html>
