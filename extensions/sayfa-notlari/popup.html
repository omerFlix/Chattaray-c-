<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e8e8f0;
      margin: 0;
      padding: 12px;
      width: 260px;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #6c63ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      background: #0f0f1a;
      border: 1px solid rgba(108, 99, 255, 0.3);
      border-radius: 6px;
      color: #e8e8f0;
      padding: 8px;
      font-family: inherit;
      font-size: 12px;
      resize: none;
      outline: none;
    }
    textarea:focus {
      border-color: #a855f7;
    }
    .save-indicator {
      font-size: 11px;
      color: #10b981;
      opacity: 0;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <h3>
    <span>📝 Hızlı Notlar</span>
    <span id="saved" class="save-indicator">Kaydedildi!</span>
  </h3>
  <textarea id="notes" placeholder="Buraya notlarını yaz..."></textarea>
  <script src="popup.js"></script>
</body>
</html>
